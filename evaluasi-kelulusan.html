<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Blog — Kelola Artikel</title>
    <link rel="stylesheet" href="./evaluasi-kelulusan.css">
</head>

<body>
    <section>

        <div class="header-banner">
            <h1>📝 Simple Blog</h1>
            <button id="btn-tema">🌙 Mode Gelap</button>
        </div>

        <div class="article-form-box">
            <h2 id="form-heading">➕ Tambah Artikel Baru</h2>
            <form id="article-form">
                <input type="hidden" id="article-id" value="" />
                
                <div class="form-group">
                    <input type="text" id="article-title" placeholder="Judul Artikel..." required />
                </div>

                <div class="form-group">
                    <textarea id="article-body" rows="4" placeholder="Tuliskan isi artikel di sini..." required></textarea>
                </div>

                <div class="btn-group">
                    <button type="submit" id="btn-submit-article" class="btn-primary">Simpan Artikel</button>
                    <button type="button" id="btn-cancel-article" class="btn-secondary" style="display: none;">Batal Edit</button>
                </div>
            </form>
        </div>

        <div class="search-box">
            <input type="text" id="input-cari-article" placeholder="🔍 Cari artikel berdasarkan judul..." />
        </div>

        <p id="notif-article" class="notif-pesan"></p>

        <div class="blog-list-section">
            <h2>📜 Daftar Artikel</h2>
            <div id="article-list-container" class="card-container">
                <!-- Artikel dimuat via JS -->
            </div>
        </div>
    </section>

    <script src="./evaluasi-kelulusan.js"></script>
</body>

</html>
